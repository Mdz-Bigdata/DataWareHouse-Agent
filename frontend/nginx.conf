server {
    listen 80;
    server_name _;

    # Where the Dockerfile copies the Vite build output. Without an explicit
    # root nginx falls back to its compiled-in default (/etc/nginx/html, which
    # does not exist in the alpine image), so the SPA fallback below turns into
    # "rewrite or internal redirection cycle ... /index.html" and every page
    # request returns 500.
    root /usr/share/nginx/html;
    index index.html;

    location /platform/ {
        proxy_pass http://platform-gateway:8080/platform/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/platform/ {
        proxy_pass http://platform-gateway:8080/api/platform/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-ID $request_id;
    }

    location /api/ {
        proxy_pass http://core-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
