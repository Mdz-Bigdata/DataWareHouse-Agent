; =============================================================================
; 仓库根 pytest 配置——统一测试发现规则与 marker 定义。
;
; 覆盖范围：backend/tests（智能问数后端）与 tests/platform（平台网关 / 启动器）。
; **不覆盖** apps/adas-closed-loop-lakehouse：它自带 [tool.pytest.ini_options]，
; pytest 会优先认它自己的 pyproject.toml 作为 rootdir，走 `make check`。
;
; 为什么是 pytest.ini 而不是根 pyproject.toml：根目录放 pyproject.toml 会让 pip /
; build 后端把整个仓库当成一个可安装包（这是个多项目 monorepo，不是），
; pytest.ini 只做测试配置，没有这个副作用。
;
; 用法：
;   pytest                       # 根目录裸跑，两个套件一起
;   pytest backend/tests -q      # 只跑后端
;   pytest -m "not requires_db"  # CI 用：跳过依赖外部服务的用例
; =============================================================================
[pytest]
minversion = 8.0

testpaths =
    backend/tests
    tests/platform

; 让 `app.*`（backend 包根）与 `platform_gateway.*`（仓库根）在任意 cwd 下都可导入，
; 不再依赖调用方手动 export PYTHONPATH=.
; 路径相对 rootdir（= 本文件所在目录）解析。
pythonpath =
    backend
    .

; --strict-markers：给用例**打**了未声明的 marker（@pytest.mark.requires_bd 这种
;                   拼写错误）时直接报收集错误，而不是降级成一条容易被无视的
;                   PytestUnknownMarkWarning。
;                   注意它管不到 `-m "..."` 表达式里的拼写——pytest 对未知名字
;                   一律当「没有用例匹配」处理，全量静默跳过也不报错。那一侧由
;                   backend/tests/test_s7_ci.py 交叉核对 CI 与本文件来兜底。
; --strict-config ：ini 里有未知键就报错，防止配置写错却毫无反馈。
addopts = -ra --strict-markers --strict-config

; -----------------------------------------------------------------------------
; Marker 定义
;
; CI（GitHub Actions runner）**没有数据库、没有 Docker、没有外网凭据**。
; 依赖这些外部服务的用例请打上对应 marker，CI 以 `-m "not requires_db and ..."`
; 排除；本地有环境时不加 -m 即可全量跑。
;
; 注意：打 marker 是为了「在没有依赖时跳过」，不是删测试。用例本身必须保留，
; 且在依赖齐备的环境下必须真的执行并断言。
; -----------------------------------------------------------------------------
markers =
    requires_db: 需要可连接的真实数据库（PostgreSQL / MySQL / Doris 等），CI 中排除
    requires_docker: 需要本机 Docker 守护进程（拉容器、compose 起栈），CI 中排除
    requires_network: 需要访问外部网络或第三方 API（大模型厂商、对象存储），CI 中排除
    requires_llm_key: 需要真实的大模型 API Key，CI 中排除
    integration: 跨组件集成测试，比单测慢，允许在 CI 里单独分档运行
    slow: 单条耗时显著（> 5s）的用例
