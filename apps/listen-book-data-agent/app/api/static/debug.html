<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听书问数 - 查询调试</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #101716;
      --panel: #17211f;
      --panel-alt: #1c2825;
      --line: #324541;
      --text: #edf4f1;
      --muted: #9eb1aa;
      --accent: #50c7a5;
      --accent-deep: #163f35;
      --error: #ff9b91;
      --warning: #f3c86d;
      --radius: 12px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--page); color: var(--text); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 26px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.03em; }
    h1 span { color: var(--accent); font-weight: 500; }
    .subtle { margin-top: 7px; color: var(--muted); font-size: 14px; }
    .status { display: inline-flex; align-items: center; min-height: 34px; border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; color: var(--muted); font-size: 13px; }
    .status.running { border-color: var(--accent); color: var(--accent); }
    .status.error { border-color: var(--error); color: var(--error); }
    .query-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    label { display: block; margin-bottom: 9px; color: var(--muted); font-size: 13px; }
    textarea { width: 100%; min-height: 92px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: #101816; color: var(--text); padding: 12px; line-height: 1.55; outline: none; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(80 199 165 / 18%); }
    .controls { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
    .primary, .secondary, .sample { border-radius: 8px; min-height: 40px; padding: 0 14px; white-space: nowrap; }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: #08221b; font-weight: 700; }
    .primary:hover { background: #73d9ba; }
    .primary:active { transform: translateY(1px); }
    .secondary, .sample { border: 1px solid var(--line); background: transparent; color: var(--muted); }
    .secondary:hover, .sample:hover { color: var(--text); border-color: #5f7971; }
    .primary:disabled { opacity: .55; cursor: wait; }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .sample { min-height: 30px; font-size: 12px; padding: 0 10px; }
    .workspace { display: grid; grid-template-columns: minmax(260px, .78fr) minmax(0, 1.65fr); gap: 18px; margin-top: 18px; }
    .stack { display: grid; align-content: start; gap: 18px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    h2 { font-size: 14px; letter-spacing: .01em; }
    .panel-body { padding: 16px; }
    .empty { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .timeline { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
    .timeline li { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .mark { width: 8px; height: 8px; border-radius: 50%; background: #60736d; }
    .timeline .running .mark { background: var(--accent); }
    .timeline .success .mark { background: var(--accent); }
    .timeline .error .mark { background: var(--error); }
    .timeline small { color: #789087; }
    .context-grid { display: grid; gap: 10px; font-size: 13px; }
    .context-grid div { display: grid; gap: 3px; }
    .context-grid dt { color: var(--muted); }
    .context-grid dd { margin: 0; overflow-wrap: anywhere; }
    pre { margin: 0; overflow: auto; padding: 16px; min-height: 100px; background: #0c1211; color: #c5e4d9; font: 13px/1.65 Consolas, "Cascadia Code", monospace; white-space: pre-wrap; }
    .result-wrap { overflow: auto; max-height: 360px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid #293a36; white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--panel-alt); color: var(--muted); font-weight: 500; }
    td { color: #dce9e4; }
    tr:last-child td { border-bottom: 0; }
    .answer { white-space: pre-wrap; color: #dce9e4; line-height: 1.75; }
    .error-box { display: none; padding: 13px 16px; border-left: 3px solid var(--error); background: rgb(255 155 145 / 10%); color: var(--error); font-size: 14px; line-height: 1.6; }
    .error-box.visible { display: block; }
    .meta { color: var(--muted); font: 12px Consolas, "Cascadia Code", monospace; }
    .meta strong { color: var(--text); font-weight: 500; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 18px; }
      .topbar, .query-panel { display: grid; grid-template-columns: 1fr; }
      .controls { display: flex; flex-direction: row; justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>听书问数 <span>查询调试</span></h1>
        <p class="subtle">查看每个执行阶段、已校验 SQL、查询结果和基于事实的解释。</p>
      </div>
      <output id="run-status" class="status">等待查询</output>
    </header>

    <section class="query-panel" aria-labelledby="query-label">
      <div>
        <label id="query-label" for="query-input">自然语言问题</label>
        <textarea id="query-input" placeholder="例如：最近7天播放量最高的前10个专辑"></textarea>
        <div class="samples" aria-label="示例问题">
          <button class="sample" type="button" data-query="最近7天播放量最高的前10个专辑">专辑播放排行</button>
          <button class="sample" type="button" data-query="本月播放完成率按天趋势">完播率趋势</button>
          <button class="sample" type="button" data-query="本月退款金额是多少">退款金额</button>
        </div>
      </div>
      <div class="controls">
        <button id="run-button" class="primary" type="button">执行查询</button>
        <button id="clear-button" class="secondary" type="button">清空</button>
      </div>
    </section>

    <div id="error-box" class="error-box" role="alert"></div>

    <section class="workspace" aria-label="查询调试工作区">
      <aside class="stack">
        <section class="panel" aria-labelledby="progress-title">
          <div class="panel-head"><h2 id="progress-title">执行进度</h2><span id="duration" class="meta"></span></div>
          <div class="panel-body"><ol id="timeline" class="timeline"><li class="empty">执行后会显示每个阶段。</li></ol></div>
        </section>
        <section class="panel" aria-labelledby="context-title">
          <div class="panel-head"><h2 id="context-title">请求上下文</h2></div>
          <div class="panel-body">
            <dl class="context-grid">
              <div><dt>请求 ID</dt><dd id="request-id">-</dd></div>
              <div><dt>分析计划</dt><dd id="analysis-plan">-</dd></div>
              <div><dt>数据表</dt><dd id="tables">-</dd></div>
            </dl>
          </div>
        </section>
      </aside>

      <div class="stack">
        <section class="panel" aria-labelledby="sql-title">
          <div class="panel-head"><h2 id="sql-title">已校验 SQL</h2><span id="sql-status" class="meta"></span></div>
          <pre id="sql-output">等待安全校验后的 SQL。</pre>
        </section>
        <section class="panel" aria-labelledby="result-title">
          <div class="panel-head"><h2 id="result-title">查询结果</h2><span id="result-meta" class="meta"></span></div>
          <div id="result-output" class="panel-body empty">执行后会显示结果表格。</div>
        </section>
        <section class="panel" aria-labelledby="answer-title">
          <div class="panel-head"><h2 id="answer-title">结果解释</h2></div>
          <div id="answer-output" class="panel-body answer empty">解释会严格基于实际 SQL 和返回数据生成。</div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById("query-input");
    const runButton = document.getElementById("run-button");
    const clearButton = document.getElementById("clear-button");
    const timeline = document.getElementById("timeline");
    const status = document.getElementById("run-status");
    const errorBox = document.getElementById("error-box");
    const sqlOutput = document.getElementById("sql-output");
    const sqlStatus = document.getElementById("sql-status");
    const resultOutput = document.getElementById("result-output");
    const resultMeta = document.getElementById("result-meta");
    const answerOutput = document.getElementById("answer-output");
    const requestId = document.getElementById("request-id");
    const analysisPlan = document.getElementById("analysis-plan");
    const tables = document.getElementById("tables");
    const duration = document.getElementById("duration");

    document.querySelectorAll("[data-query]").forEach((button) => {
      button.addEventListener("click", () => { input.value = button.dataset.query; input.focus(); });
    });
    clearButton.addEventListener("click", reset);
    runButton.addEventListener("click", runQuery);
    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") runQuery();
    });

    function reset() {
      input.value = "";
      timeline.innerHTML = '<li class="empty">执行后会显示每个阶段。</li>';
      sqlOutput.textContent = "等待安全校验后的 SQL。";
      sqlStatus.textContent = "";
      resultOutput.className = "panel-body empty";
      resultOutput.textContent = "执行后会显示结果表格。";
      resultMeta.textContent = "";
      answerOutput.className = "panel-body answer empty";
      answerOutput.textContent = "解释会严格基于实际 SQL 和返回数据生成。";
      requestId.textContent = "-";
      analysisPlan.textContent = "-";
      tables.textContent = "-";
      duration.textContent = "";
      errorBox.className = "error-box";
      errorBox.textContent = "";
      setStatus("等待查询");
    }

    async function runQuery() {
      const query = input.value.trim();
      if (!query) {
        showError("请输入问题后再执行查询。");
        input.focus();
        return;
      }
      resetResults();
      runButton.disabled = true;
      runButton.textContent = "查询中";
      setStatus("正在执行", "running");
      try {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
          body: JSON.stringify({ query })
        });
        if (!response.ok || !response.body) throw new Error(`请求失败 (${response.status})`);
        await readSse(response.body);
      } catch (error) {
        showError(error.message || "请求无法完成。");
        setStatus("请求失败", "error");
      } finally {
        runButton.disabled = false;
        runButton.textContent = "执行查询";
      }
    }

    function resetResults() {
      timeline.innerHTML = "";
      sqlOutput.textContent = "等待安全校验后的 SQL。";
      sqlStatus.textContent = "";
      resultOutput.className = "panel-body empty";
      resultOutput.textContent = "等待查询结果。";
      resultMeta.textContent = "";
      answerOutput.className = "panel-body answer empty";
      answerOutput.textContent = "等待基于事实的解释。";
      errorBox.className = "error-box";
      errorBox.textContent = "";
      duration.textContent = "";
    }

    async function readSse(stream) {
      const reader = stream.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          handleFrame(frame);
        }
        if (done) break;
      }
    }

    function handleFrame(frame) {
      const eventLine = frame.split("\n").find((line) => line.startsWith("event:"));
      const dataLine = frame.split("\n").find((line) => line.startsWith("data:"));
      if (!eventLine || !dataLine) return;
      const type = eventLine.slice(6).trim();
      let data;
      try { data = JSON.parse(dataLine.slice(5)); } catch (_) { return; }
      if (data.request_id) requestId.textContent = data.request_id;
      if (type === "progress") updateProgress(data);
      if (type === "context") updateContext(data);
      if (type === "sql") { sqlOutput.textContent = data.sql; sqlStatus.textContent = data.status || "已校验"; }
      if (type === "result") renderResult(data);
      if (type === "answer") { answerOutput.className = "panel-body answer"; answerOutput.textContent = data.summary || "未生成解释。"; }
      if (type === "error") { showError(data.message || "查询失败。"); setStatus("执行失败", "error"); }
      if (type === "done") { duration.textContent = `${data.duration_ms || 0} ms`; if (data.status === "completed") setStatus("已完成"); }
    }

    function updateProgress(data) {
      const existing = timeline.querySelector(`[data-step="${CSS.escape(data.step || "")}"]`);
      const item = existing || document.createElement("li");
      if (!existing) { item.dataset.step = data.step || "未知阶段"; item.innerHTML = '<span class="mark"></span><span></span><small></small>'; timeline.appendChild(item); }
      item.className = data.status || "";
      item.children[1].textContent = data.step || "未知阶段";
      item.children[2].textContent = data.status || "";
    }

    function updateContext(data) {
      if (data.analysis_plan) analysisPlan.textContent = JSON.stringify(data.analysis_plan);
      if (data.tables) tables.textContent = data.tables.join(", ");
    }

    function renderResult(data) {
      const rows = data.data || [];
      resultMeta.textContent = `${data.row_count || 0} 行${data.truncated ? "，可能已截断" : ""}`;
      if (!rows.length) { resultOutput.className = "panel-body empty"; resultOutput.textContent = "查询未返回数据。"; return; }
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      (data.columns || Object.keys(rows[0])).forEach((column) => { const cell = document.createElement("th"); cell.textContent = column; headRow.appendChild(cell); });
      head.appendChild(headRow);
      const body = document.createElement("tbody");
      rows.forEach((row) => { const tr = document.createElement("tr"); (data.columns || Object.keys(row)).forEach((column) => { const td = document.createElement("td"); td.textContent = row[column] ?? ""; tr.appendChild(td); }); body.appendChild(tr); });
      table.append(head, body);
      const wrapper = document.createElement("div"); wrapper.className = "result-wrap"; wrapper.appendChild(table);
      resultOutput.className = "";
      resultOutput.replaceChildren(wrapper);
    }

    function showError(message) { errorBox.textContent = message; errorBox.className = "error-box visible"; }
    function setStatus(text, kind = "") { status.textContent = text; status.className = `status ${kind}`; }
  </script>
</body>
</html>
