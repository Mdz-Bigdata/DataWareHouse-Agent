# 听书问数工作台 — 同域反向代理
# / 提供 React SPA；/api/、/health、/ready、/debug 反向代理到 FastAPI（compose 服务名 app）。
# SSE 路由关闭代理缓冲，读取超时 300 秒。

# 生产环境在网关/负载均衡层终止 TLS 时，本文件只需监听 80。
# 如需 Nginx 直接提供 HTTPS，取消以下注释并挂载证书：
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/certs/server.crt;
#   ssl_certificate_key /etc/nginx/certs/server.key;
# 并将 80 端口改为跳转：return 301 https://$host$request_uri;

upstream listenbook_api {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头（设置了自定义 add_header 的 location 会覆盖 server 级配置，需在各处重复）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- SSE 查询接口：必须关闭缓冲，否则进度事件无法实时到达 ---
    location /api/ {
        proxy_pass http://listenbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://listenbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /ready {
        proxy_pass http://listenbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # 旧调试页，故障排查期间保留
    location = /debug {
        proxy_pass http://listenbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Prometheus 指标抓取端点（Phase 0.6）
    # 生产环境建议在网关层限制仅内网可访问，避免指标数据泄露。
    location = /metrics {
        proxy_pass http://listenbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # 指纹静态资源：长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # SPA 入口与前端路由回退：禁止长期缓存，保证发布后立即生效
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
