# 持续集成：每次 push / PR 到 main 触发后端 lint/test + 前端 typecheck/build。
# 说明：integration 标记的测试需要真实 MySQL/Qdrant/ES，CI 中默认跳过。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Verify uv.lock is current
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group dev --group data

      # 仓库正在渐进式清理历史 lint/type 债务；PR 与 push 必须保证本次
      # 变更的 Python 文件通过 Ruff，同时全量执行语法检查和单元测试。
      - name: Collect changed Python files
        id: changed-python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.py' \
            > "$RUNNER_TEMP/changed-python.txt"
          if [[ -s "$RUNNER_TEMP/changed-python.txt" ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ruff check
        if: steps.changed-python.outputs.has_files == 'true'
        run: xargs -a "$RUNNER_TEMP/changed-python.txt" uv run ruff check

      - name: Ruff format check
        if: steps.changed-python.outputs.has_files == 'true'
        run: xargs -a "$RUNNER_TEMP/changed-python.txt" uv run ruff format --check

      - name: Syntax check (compileall)
        run: uv run python -m compileall -q app tests

      - name: Pytest (unit, skip integration)
        run: uv run pytest -q -m "not integration"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
