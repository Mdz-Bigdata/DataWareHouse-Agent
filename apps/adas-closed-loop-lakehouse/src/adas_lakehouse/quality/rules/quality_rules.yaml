    enabled: true
    field: trigger_time
    issue_level: P2
    message: 时间戳不合理：早于车辆出厂时间或晚于服务器时间 + 容忍窗口（车端时钟漂移）
    notes: ⚠️ 原文未明确，本项目设计：容忍窗口大小原文未给，默认见 thresholds
    params:
      future_tolerance_seconds: 300.0
      not_before_field: vehicle_manufacture_time
    quality_layer: L2
    repair_action: A
    rule_id: QG-KFK-002-event-time-window
    scope: record
    severity: WARNING
    source: 原文四、4.2 Kafka 消息流 · 事件数据（时间戳合理性 → 告警标记放行）
unique_key:
